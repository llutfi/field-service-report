<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Field Service Report</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-orange-50 min-h-screen p-4">
    <div class="max-w-3xl mx-auto">
      <!-- HEADER -->

      <!-- HEADER -->
      <div class="card header-card">
        <div class="header-left">
          <h1 class="text-3xl font-black">FIELD SERVICE REPORT</h1>
          <p class="text-lg font-bold mt-2">PT MRENE WAE SOLUSI</p>
        </div>

        <div class="header-right">
          <img src="assets/logo-mws1.png" alt="MWS Logo" class="logo" />
        </div>
      </div>

      <!-- FORM -->

      <div class="card">
        <form id="reportForm">
          <!-- NO LAPORAN -->

          <div class="mb-4">
            <label class="label"> Nomor Laporan </label>

            <input
              type="text"
              id="reportNumber"
              readonly
              class="input bg-gray-100"
            />
          </div>

          <!-- Input Tanggal Manual -->
          <div class="mb-4">
            <label class="block text-sm font-bold mb-1"
              >Tanggal Pekerjaan</label
            >
            <input
              type="date"
              id="tanggal_manual"
              name="tanggal_manual"
              class="input bg-gray-100"
              required
            />
          </div>

          <!-- CUSTOMER -->

          <div class="mb-4">
            <label class="label"> Customer </label>

            <select id="customer" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- NO PROJECT -->

          <div class="mb-4">
            <label class="label"> No Kontrak </label>

            <select id="noProject" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- NAMA PROJECT -->

          <div class="mb-4">
            <label class="label">Nama Project</label>

            <select id="namaProject" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- LOKASI PROJECT -->
          <div class="mb-4">
            <label class="block text-sm font-bold mb-2">Lokasi Project</label>

            <!-- Choice Toggle -->
            <div class="flex gap-4 mb-3">
              <label class="inline-flex items-center cursor-pointer">
                <input
                  type="radio"
                  name="location_mode"
                  value="gps"
                  checked
                  onchange="toggleLocationMode()"
                  class="form-radio text-black"
                />
                <span class="ml-2 font-semibold text-sm">Gunakan GPS</span>
              </label>
              <label class="inline-flex items-center cursor-pointer">
                <input
                  type="radio"
                  name="location_mode"
                  value="manual"
                  onchange="toggleLocationMode()"
                  class="form-radio text-black"
                />
                <span class="ml-2 font-semibold text-sm"
                  >Pilih dari Master Location</span
                >
              </label>
            </div>

            <!-- Mode 1: GPS Container -->
            <div id="gps_container" class="flex gap-2">
              <input
                type="text"
                id="latitude"
                placeholder="Latitude"
                readonly
                class="w-1/2 p-2 border-2 border-black rounded bg-gray-100 text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
              />
              <input
                type="text"
                id="longitude"
                placeholder="Longitude"
                readonly
                class="w-1/2 p-2 border-2 border-black rounded bg-gray-100 text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
              />
              <button
                type="button"
                onclick="getGPSLocation()"
                class="px-3 py-2 bg-black text-white font-bold rounded hover:bg-gray-800 text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5"
              >
                GPS
              </button>
            </div>

            <!-- Mode 2: Dropdown Master Location Container -->
            <div id="manual_location_container" class="hidden mt-2">
              <!-- ID DISESUAIKAN DENGAN app.js ("lokasi") -->
              <select
                id="lokasi"
                class="w-full p-2 border-2 border-black rounded bg-white text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
              >
                <option value="">-- Pilih Lokasi / Plant --</option>
              </select>
            </div>
          </div>

          <!-- TEKNISI -->

          <div class="mb-4">
            <label class="label"> Teknisi </label>

            <select id="teknisi" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- PEKERJA DAN PENGAWAS -->
          <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="label">Nama Pekerja</label>
              <textarea
                id="pekerja"
                rows="3"
                class="input"
                placeholder="Masukkan Nama Pekerja ( , ) setiap ahkir nama"
              ></textarea>
            </div>
            <div>
              <label class="label">Nama Pengawas</label>
              <textarea
                id="pengawas"
                rows="3"
                class="input"
                placeholder="Masukkan Nama Pengawas ( , ) setiap ahkir nama"
              ></textarea>
            </div>
          </div>

          <!-- ALATAN -->

          <div class="mb-4">
            <label class="label"> Alatan </label>

            <div
              id="alatanContainer"
              class="grid grid-cols-1 md:grid-cols-2 gap-2"
            >
              <p>Memuat data...</p>
            </div>
          </div>

          <!-- PARAMETER -->

          <div class="mb-4">
            <label class="label"> Parameter </label>

            <div class="grid grid-cols-2 gap-2">
              <label
                ><input type="checkbox" name="parameter" value="SO2" />
                SO2</label
              >
              <label
                ><input type="checkbox" name="parameter" value="NO" /> NO</label
              >
              <label
                ><input type="checkbox" name="parameter" value="NO2" />
                NO2</label
              >
              <label
                ><input type="checkbox" name="parameter" value="CO" /> CO</label
              >
              <label
                ><input type="checkbox" name="parameter" value="O2" /> O2</label
              >
              <label
                ><input type="checkbox" name="parameter" value="NH3" />
                NH3</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Flow" />
                Flow</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Pressure" />
                Pressure</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                Temperature</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                NOx
              </label>
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                C02
              </label>
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                Hg</label
              >
            </div>
          </div>

          <!-- KATEGORI -->

          <div class="mb-4">
            <label class="label"> Kategori Pekerjaan </label>

            <div class="grid grid-cols-2 gap-2">
              <label
                ><input type="checkbox" name="kategori" value="Maintenance" />
                Maintenance</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Calibration" />
                Calibration</label
              >
              <label
                ><input
                  type="checkbox"
                  name="kategori"
                  value="Troubleshooting"
                />
                Troubleshooting</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Commissioning" />
                Commissioning</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Inspection" />
                Inspection</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Training" />
                Training</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Retrofit" />
                Retrofit
              </label>
              <label
                ><input type="checkbox" name="kategori" value="Installation" />
                Installation</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Integration" />
                Integration</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Survey" /> Site
                Survey</label
              >
            </div>
          </div>

          <!-- DESKRIPSI -->

          <div class="mb-4">
            <label class="label"> Deskripsi Pekerjaan </label>

            <textarea
              id="deskripsi"
              rows="5"
              class="input"
              placeholder="Masukkan Deskripsi Pekerjaan..."
            ></textarea>
          </div>

          <!-- RENCANA KERJA ESOK HARI -->
          <div class="mb-4">
            <label class="label"> Rencana Kerja Esok Hari </label>

            <textarea
              id="rencana_kerja"
              rows="5"
              class="input"
              placeholder="Masukkan rencana pekerjaan esok hari..."
            ></textarea>
          </div>

          <!-- STATUS -->

          <div class="mb-4">
            <label class="label"> Status </label>

            <select id="status" class="input">
              <option value="">Pilih Status</option>

              <option value="Selesai">🟢 Selesai</option>

              <option value="On Progress">🟡 On Progress</option>

              <option value="Belum Selesai">🔴 Belum Selesai</option>
            </select>
          </div>

          <!-- FOTO SEBELUM -->

          <div class="mb-6">
            <label class="label"> 📷 Foto Sebelum (Max 4) </label>

            <input
              type="file"
              id="beforePhoto"
              accept="image/*"
              multiple
              class="input"
            />

            <div
              id="beforePreviewContainer"
              class="grid grid-cols-2 gap-3 mt-3"
            ></div>
          </div>

          <!-- FOTO SESUDAH -->

          <div class="mb-6">
            <label class="label"> 📷 Foto Sesudah (Max 4) </label>

            <input
              type="file"
              id="afterPhoto"
              accept="image/*"
              multiple
              class="input"
            />

            <div
              id="afterPreviewContainer"
              class="grid grid-cols-2 gap-3 mt-3"
            ></div>
          </div>

          <!-- KOTAK TANDA TANGAN DIGITAL -->
          <div class="mb-4">
            <label class="label font-bold text-gray-700"
              >Tanda Tangan Teknisi</label
            >
            <div
              class="border-2 border-dashed border-gray-300 rounded-lg p-2 bg-slate-50 flex flex-col items-center w-full"
            >
              <!-- Canvas dibuat responsive (w-full) dengan touch-action: none -->
              <canvas
                id="signatureCanvas"
                class="w-full h-44 bg-white border-2 border-blue-500 rounded-lg touch-none shadow-sm cursor-crosshair"
              ></canvas>

              <div class="mt-2 flex justify-end w-full">
                <button
                  type="button"
                  id="clearSignatureBtn"
                  class="px-3 py-1 text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 rounded font-semibold transition-colors"
                >
                  🧹 Hapus Tanda Tangan
                </button>
              </div>
            </div>
          </div>

          <!-- BUTTON -->

          <div class="grid grid-cols-2 gap-3">
            <button id="saveBtn" type="submit" class="btn-main">
              SIMPAN LAPORAN
            </button>

            <button id="pdfBtn" type="button" class="btn-pdf">
              📄 DOWNLOAD PDF
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- TARUH MODAL PREVIEW PDF  -->
    <div
      id="pdfModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          background: #fff;
          width: 90%;
          max-width: 900px;
          height: 85vh;
          border-radius: 8px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        "
      >
        <!-- Header Modal -->
        <div
          style="
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h3
            style="margin: 0; font-size: 18px; font-weight: bold"
            id="modalReportTitle"
          >
            Preview Laporan
          </h3>
          <button
            onclick="closePdfModal()"
            style="
              border: none;
              background: transparent;
              font-size: 24px;
              cursor: pointer;
            "
          >
            &times;
          </button>
        </div>

        <!-- Body Modal (Display PDF) -->
        <div style="flex: 1; background: #525659">
          <iframe
            id="pdfPreviewIframe"
            src=""
            style="width: 100%; height: 100%; border: none"
          ></iframe>
        </div>

        <!-- Footer Modal -->
        <div
          style="
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
          "
        >
          <button
            onclick="closePdfModal()"
            style="
              padding: 8px 16px;
              border: 1px solid #ccc;
              background: #fff;
              border-radius: 4px;
              cursor: pointer;
              font-weight: bold;
            "
          >
            Tutup
          </button>
          <!-- <a
            id="btnDownloadPdf"
            href=""
            target="_blank"
            style="
              padding: 8px 16px;
              background: #fd0d0d;
              color: #fff;
              text-decoration: none;
              border-radius: 4px;
              font-weight: bold;
            "
            >Download PDF</a
          > -->
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
