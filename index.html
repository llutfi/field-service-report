<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Field Service Report</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-orange-50 min-h-screen p-4">
    <div class="max-w-3xl mx-auto">
      <!-- HEADER -->

      <!-- HEADER -->
      <div class="card header-card">
        <div class="header-left">
          <h1 class="text-3xl font-black">FIELD SERVICE REPORT</h1>
          <p class="text-lg font-bold mt-2">PT MRENE WAE SOLUSI</p>
        </div>

        <div class="header-right">
          <img src="assets/logo-mws1.png" alt="MWS Logo" class="logo" />
        </div>
      </div>

      <!-- FORM -->

      <div class="card">
        <form id="reportForm">
          <!-- NO LAPORAN -->

          <div class="mb-4">
            <label class="label"> Nomor Laporan </label>

            <input
              type="text"
              id="reportNumber"
              readonly
              class="input bg-gray-100"
            />
          </div>

          <!-- CUSTOMER -->

          <div class="mb-4">
            <label class="label"> Customer </label>

            <select id="customer" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- NO PROJECT -->

          <div class="mb-4">
            <label class="label"> No Kontrak </label>

            <select id="noProject" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- NAMA PROJECT -->

          <div class="mb-4">
            <label class="label">Nama Project</label>

            <select id="namaProject" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- ALAMAT -->

          <div class="mb-4">
            <label class="label">Lokasi Project</label>

            <select id="lokasi" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <input type="hidden" id="latitude" />
          <input type="hidden" id="longitude" />

          <!-- TEKNISI -->

          <div class="mb-4">
            <label class="label"> Teknisi </label>

            <select id="teknisi" class="input">
              <option>Memuat data...</option>
            </select>
          </div>

          <!-- ALATAN -->

          <div class="mb-4">
            <label class="label"> Alatan </label>

            <div
              id="alatanContainer"
              class="grid grid-cols-1 md:grid-cols-2 gap-2"
            >
              <p>Memuat data...</p>
            </div>
          </div>

          <!-- PARAMETER -->

          <div class="mb-4">
            <label class="label"> Parameter </label>

            <div class="grid grid-cols-2 gap-2">
              <label
                ><input type="checkbox" name="parameter" value="SO2" />
                SO2</label
              >
              <label
                ><input type="checkbox" name="parameter" value="NO" /> NO</label
              >
              <label
                ><input type="checkbox" name="parameter" value="NO2" />
                NO2</label
              >
              <label
                ><input type="checkbox" name="parameter" value="CO" /> CO</label
              >
              <label
                ><input type="checkbox" name="parameter" value="O2" /> O2</label
              >
              <label
                ><input type="checkbox" name="parameter" value="NH3" />
                NH3</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Flow" />
                Flow</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Pressure" />
                Pressure</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                Temperature</label
              >
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                NOx
              </label>
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                C02
              </label>
              <label
                ><input type="checkbox" name="parameter" value="Temperature" />
                Hg</label
              >
            </div>
          </div>

          <!-- KATEGORI -->

          <div class="mb-4">
            <label class="label"> Kategori Pekerjaan </label>

            <div class="grid grid-cols-2 gap-2">
              <label
                ><input type="checkbox" name="kategori" value="Maintenance" />
                Maintenance</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Calibration" />
                Calibration</label
              >
              <label
                ><input
                  type="checkbox"
                  name="kategori"
                  value="Troubleshooting"
                />
                Troubleshooting</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Commissioning" />
                Commissioning</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Inspection" />
                Inspection</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Training" />
                Training</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Training" />
                Retrofit
              </label>
              <label
                ><input type="checkbox" name="kategori" value="Training" />
                Installation</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Training" />
                Integration</label
              >
              <label
                ><input type="checkbox" name="kategori" value="Training" /> Site
                Survey</label
              >
            </div>
          </div>

          <!-- DESKRIPSI -->

          <div class="mb-4">
            <label class="label"> Deskripsi Pekerjaan </label>

            <textarea id="deskripsi" rows="5" class="input"></textarea>
          </div>

          <!-- STATUS -->

          <div class="mb-4">
            <label class="label"> Status </label>

            <select id="status" class="input">
              <option value="">Pilih Status</option>

              <option value="Selesai">🟢 Selesai</option>

              <option value="On Progress">🟡 On Progress</option>

              <option value="Belum Selesai">🔴 Belum Selesai</option>
            </select>
          </div>

          <!-- FOTO SEBELUM -->

          <div class="mb-6">
            <label class="label"> 📷 Foto Sebelum (Max 4) </label>

            <input
              type="file"
              id="beforePhoto"
              accept="image/*"
              multiple
              class="input"
            />

            <div
              id="beforePreviewContainer"
              class="grid grid-cols-2 gap-3 mt-3"
            ></div>
          </div>

          <!-- FOTO SESUDAH -->

          <div class="mb-6">
            <label class="label"> 📷 Foto Sesudah (Max 4) </label>

            <input
              type="file"
              id="afterPhoto"
              accept="image/*"
              multiple
              class="input"
            />

            <div
              id="afterPreviewContainer"
              class="grid grid-cols-2 gap-3 mt-3"
            ></div>
          </div>

          <!-- BUTTON -->

          <div class="grid grid-cols-2 gap-3">
            <button id="saveBtn" type="submit" class="btn-main">
              SIMPAN LAPORAN
            </button>

            <button id="pdfBtn" type="button" class="btn-pdf">
              📄 DOWNLOAD PDF
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
